services:

  postgres:
    image: postgres:18
    container_name: portal-solicitacoes-postgres
    environment:
      POSTGRES_DB: portal_solicitacoes
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./solicitacoes-internas
      dockerfile: Dockerfile
    container_name: portal-solicitacoes-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal_solicitacoes
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontServices
      dockerfile: Dockerfile
    image: portal-solicitacoes-frontend
    container_name: portal-solicitacoes-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: